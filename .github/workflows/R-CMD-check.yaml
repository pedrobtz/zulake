on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again, in every package at
  # once. Main is checked by the schedule below, which skips a commit it has
  # already checked (README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run R-CMD-check.yml --ref main`.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests and on pushes to main. Full on the weekly
      # schedule, on a manual dispatch, and on a pull request labelled
      # `full-ci`.
      profile: auto
      # The shared four legs plus Windows R-devel, the combination CRAN's own
      # Windows R-devel check runs and win-builder would have caught. Full
      # profile only: quick pull requests run `quick-runners`.
      runners: |
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
      # No container leg on a quick run. clang23 is there for C compiler
      # diagnostics, and zulake has no src/ (D1), while building its Suggests
      # from source in the image took 10.5 of the leg's 11.8 minutes on #15,
      # past the five-minute quick budget. The full profile keeps all three.
      quick-containers: '[]'
      # CRAN's NOSUGGESTS flavor, full profile only: zuroar, which deletion
      # vectors need, is suggested (design D9), and a table that needs it
      # must fail with a classed error when it is absent, which only a check
      # without the Suggests shows (tests/zuroar-absent.R).
      nosuggests: true
