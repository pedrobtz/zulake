# zulake's own workflow: the example table zl-orders is built again (its
# build is deterministic), the hostile logs are made again from the tables,
# the shipped tar is packed again and zl-orders copied to
# inst/extdata/orders, deltalake 1.7.0 answers again for every fixture
# table and hostile log, and any
# difference from what is committed fails the run. So the answers the R
# tests compare against are deltalake's, for exactly the tables the package
# ships. test-fixtures.R then runs against the unpacked trees, which only
# this workflow has (#64).
#
# Gated by the `paths` filter (r-actions README, assurance.yml: a workflow
# whose pull_request trigger lists `paths` is exempt from the changes gate):
# only a pull request that touches the harness, the fixture scripts or the
# fixtures runs it. On demand: `gh workflow run oracle.yaml --ref <branch>`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "tools/oracle/**"
      - "tools/fixtures/**"
      - "tests/testthat/fixtures/**"
      - "inst/extdata/**"
      - ".github/workflows/oracle.yaml"
  workflow_dispatch:

name: oracle

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  oracle:
    # Labels are decided here, without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:oracle'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The uv that wrote tools/oracle/uv.lock; Python comes from
          # tools/oracle/.python-version, deltalake from the lockfile.
          version: "0.7.11"
          enable-cache: false

      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          r-version: release

      - name: The example table (zl-orders, built deterministically)
        working-directory: tools/oracle
        run: uv run --frozen python ../fixtures/generate.py orders

      - name: Hostile logs
        run: Rscript tools/fixtures/hostile.R

      - name: The hostile log that needs a Parquet writer
        working-directory: tools/oracle
        run: uv run --frozen python ../fixtures/hostile_parquet.py

      - name: Pack the fixtures
        working-directory: tools/oracle
        run: uv run --frozen python ../fixtures/pack.py

      # Last, as CLAUDE.md orders it: answers.py also answers for the hostile
      # logs (hostile-answers.json), so it runs after they are made again.
      - name: deltalake answers
        working-directory: tools/oracle
        run: uv run --frozen python answers.py

      # The fixture tests from the source tree, where the unpacked tables/
      # and hostile/ trees are (.Rbuildignore keeps them out of every R CMD
      # check leg, so test-fixtures.R's tar test skips there): the shipped
      # tar must hold exactly those trees, and no test may skip (#64).
      - uses: r-lib/actions/setup-r-dependencies@v2.14.0
        with:
          extra-packages: any::testthat, any::withr, local::.

      - name: The fixture tests, with the unpacked trees (test-fixtures.R)
        run: |
          Rscript -e '
            r <- as.data.frame(testthat::test_file("tests/testthat/test-fixtures.R", package = "zulake",
                                                   load_package = "installed", reporter = "summary",
                                                   stop_on_failure = TRUE))
            if (any(r$skipped)) stop("skipped here: ", paste(r$test[r$skipped], collapse = "; "))'

      - name: Regenerated equals committed
        run: |
          git add --intent-to-add --all tests/testthat/fixtures inst/extdata
          if ! git diff --exit-code --stat -- tests/testthat/fixtures inst/extdata; then
            git diff -- tests/testthat/fixtures/answers | head -200
            echo "::error::regenerated fixtures differ from the committed ones"
            exit 1
          fi
