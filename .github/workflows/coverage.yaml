on:
  pull_request:
  # Weekly on main rather than on every push to it, and on demand; the
  # badge follows (README, "Pushes to main").
  schedule:
    - cron: "29 2 * * 6"
  workflow_dispatch:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit, not `@v1`, because this call holds a write token:
    # a moved tag cannot change what runs with it. Same commit as the sibling
    # packages (qio, zuhttp).
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@59c917ddee2cd0191f8f015016c4c76c4f2a8c87 # v1.18.0
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
    permissions:
      contents: write
